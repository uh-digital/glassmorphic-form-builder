<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Glassmorphic Form Builder</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-slate-900 to-purple-900 min-h-screen text-slate-100 p-6 flex flex-col items-center justify-center">

    <header class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">
            ✨ Glassmorphic Form Builder
        </h1>
        <p class="text-slate-400 text-sm mt-1">Create dynamic custom forms with modern blur effects live!</p>
    </header>

    <div class="max-w-5xl w-full grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
        
        <!-- Left Sidebar: Controls & Tools -->
        <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl shadow-xl space-y-6">
            <div>
                <h3 class="text-sm font-semibold text-purple-400 uppercase tracking-wider mb-3">1. Add Form Fields</h3>
                <div class="grid grid-cols-1 gap-2">
                    <button onclick="addField('text')" class="w-full bg-slate-800 hover:bg-slate-700 text-left px-4 py-2.5 rounded-xl border border-slate-700 text-sm font-medium transition-all flex items-center justify-between">
                        <span>📝 Text Input</span> <span class="text-xs text-slate-500">+ Add</span>
                    </button>
                    <button onclick="addField('password')" class="w-full bg-slate-800 hover:bg-slate-700 text-left px-4 py-2.5 rounded-xl border border-slate-700 text-sm font-medium transition-all flex items-center justify-between">
                        <span>🔒 Password Input</span> <span class="text-xs text-slate-500">+ Add</span>
                    </button>
                    <button onclick="addField('dropdown')" class="w-full bg-slate-800 hover:bg-slate-700 text-left px-4 py-2.5 rounded-xl border border-slate-700 text-sm font-medium transition-all flex items-center justify-between">
                        <span>🔽 Dropdown Select</span> <span class="text-xs text-slate-500">+ Add</span>
                    </button>
                </div>
            </div>

            <div>
                <h3 class="text-sm font-semibold text-purple-400 uppercase tracking-wider mb-3">2. Styling Control</h3>
                <label class="block text-xs text-slate-400 mb-1">Background Blur Strength:</label>
                <input id="blurSlider" type="range" min="0" max="24" value="12" 
                       class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-purple-500">
            </div>

            <button id="exportBtn" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold py-3 rounded-xl transition-all shadow-md active:scale-95 text-sm">
                📋 Copy Form HTML Code
            </button>
        </div>

        <!-- Center/Right Area: Live Preview Workspace -->
        <div class="md:col-span-2 min-h-[450px] flex items-center justify-center p-8 bg-slate-950/40 border border-slate-800/60 rounded-2xl relative overflow-hidden bg-[radial-gradient(circle_at_center,rgba(139,92,246,0.1)_0,transparent_100%)]">
            
            <div class="absolute w-48 h-48 bg-pink-500/20 rounded-full blur-2xl top-10 left-10 animate-pulse"></div>
            <div class="absolute w-52 h-52 bg-purple-500/20 rounded-full blur-3xl bottom-10 right-10"></div>

            <!-- The Glassmorphic Preview Form Card Container -->
            <div id="glassForm" class="w-full max-w-md bg-white/10 border border-white/20 p-6 rounded-2xl shadow-2xl relative z-10 transition-all duration-200" style="backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);">
                <h2 id="formTitle" class="text-xl font-bold text-center mb-6 text-white tracking-wide border-b border-white/10 pb-3">Dynamic Custom Form</h2>
                
                <form id="dynamicFormContainer" class="space-y-4">
                    <p id="emptyMessage" class="text-center text-sm text-slate-400/70 py-8 font-medium">No fields added yet. Add fields from the left sidebar!</p>
                </form>
            </div>

        </div>
    </div>

    <!-- JavaScript Builder Logic -->
    <script>
        const dynamicFormContainer = document.getElementById('dynamicFormContainer');
        const emptyMessage = document.getElementById('emptyMessage');
        const glassForm = document.getElementById('glassForm');
        const blurSlider = document.getElementById('blurSlider');
        const exportBtn = document.getElementById('exportBtn');

        let fieldCount = 0;

        window.addField = function(type) {
            if (emptyMessage) emptyMessage.style.display = 'none';
            fieldCount++;

            const fieldWrapper = document.createElement('div');
            fieldWrapper.className = "relative group bg-white/5 border border-white/5 p-3 rounded-xl transition-all hover:border-white/10";
            fieldWrapper.id = `field-container-${fieldCount}`;

            let innerHTML = '';

            if (type === 'text') {
                innerHTML = `
                    <label class="block text-xs font-semibold text-slate-200 uppercase mb-1">Text Field ${fieldCount}</label>
                    <input type="text" placeholder="Enter text response..." 
                           class="w-full px-3 py-2 text-sm rounded-lg bg-black/40 border border-white/10 text-white placeholder-slate-400 focus:outline-none focus:border-purple-400">
                `;
            } else if (type === 'password') {
                innerHTML = `
                    <label class="block text-xs font-semibold text-slate-200 uppercase mb-1">Password Field ${fieldCount}</label>
                    <input type="password" placeholder="••••••••" 
                           class="w-full px-3 py-2 text-sm rounded-lg bg-black/40 border border-white/10 text-white placeholder-slate-400 focus:outline-none focus:border-purple-400">
                `;
            } else if (type === 'dropdown') {
                innerHTML = `
                    <label class="block text-xs font-semibold text-slate-200 uppercase mb-1">Dropdown Selection ${fieldCount}</label>
                    <select class="w-full px-3 py-2 text-sm rounded-lg bg-black/40 border border-white/10 text-slate-200 focus:outline-none focus:border-purple-400 cursor-pointer">
                        <option value="Option One">Option One</option>
                        <option value="Option Two">Option Two</option>
                    </select>
                `;
            }

            innerHTML += `
                <button type="button" onclick="removeField(${fieldCount})" 
                        class="absolute top-2 right-2 text-xs text-red-400 opacity-0 group-hover:opacity-100 transition-opacity hover:text-red-500 font-bold bg-black/60 px-2 py-0.5 rounded-md">
                    Remove
                </button>
            `;

            fieldWrapper.innerHTML = innerHTML;
            dynamicFormContainer.appendChild(fieldWrapper);
        };

        window.removeField = function(id) {
            const element = document.getElementById(`field-container-${id}`);
            if (element) {
                element.remove();
            }
            if (dynamicFormContainer.children.length === 0) {
                emptyMessage.style.display = 'block';
            }
        };

        blurSlider.addEventListener('input', (e) => {
            const blurValue = e.target.value;
            glassForm.style.backdropFilter = `blur(${blurValue}px)`;
            glassForm.style.webkitBackdropFilter = `blur(${blurValue}px)`;
        });

        // Custom Notification Function (Top-Center Toast Layout)
        function showToast(message, type) {
            const toast = document.createElement('div');
            
            let statusClasses = "from-emerald-500 to-green-600 border-green-400/20";
            let statusIcon = "📋";
            
            if (type === "error") {
                statusClasses = "from-rose-500 to-red-600 border-red-400/20";
                statusIcon = "❌";
            }
            
            toast.className = `fixed top-4 left-1/2 -translate-x-1/2 bg-gradient-to-r ${statusClasses} text-white px-5 py-3 rounded-xl shadow-2xl z-50 flex items-center gap-3 font-medium text-sm transition-all duration-300 transform -translate-y-10 opacity-0 border`;
            toast.innerHTML = `<span>${statusIcon}</span> <span>${message}</span>`;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('-translate-y-10', 'opacity-0');
            }, 10);
            
            setTimeout(() => {
                toast.classList.add('-translate-y-10', 'opacity-0');
                setTimeout(() => { toast.remove(); }, 300);
            }, 3000);
        }

        // Export Function Frame with Clean Form Field State Checking loops
        exportBtn.addEventListener('click', () => {
            const inputsList = dynamicFormContainer.querySelectorAll('input');
            const totalFieldsCount = dynamicFormContainer.children.length;

            // Condition 1: Checking empty container workspace form
            if (totalFieldsCount === 0 || (totalFieldsCount === 1 && emptyMessage.style.display !== 'none')) {
                showToast("Please add some fields to the form first!", "error");
                return;
            }

                        // Condition 2: Evaluating input element configurations safely 
            let emptyInputsFound = false;
            inputsList.forEach(inputItem => {
                if (inputItem.value.trim() === "") {
                    emptyInputsFound = true;
                }
            });

            if (emptyInputsFound === true) {
                showToast("Please fill all the input fields before copying the code!", "error");
                return;
            }

            // Condition 3: Success full safe content copying frameworks
            const formHTML = glassForm.outerHTML;
            navigator.clipboard.writeText(formHTML).then(() => {
                showToast("Form HTML code safely copied to clipboard!", "success");
            }).catch(() => {
                showToast("Error copying code.", "error");
            });
        });
                // 4. FIXED: Copies Form HTML wrapped with a matching Styled Dark Body Tag
        exportBtn.addEventListener('click', () => {
            const inputsList = dynamicFormContainer.querySelectorAll('input');
            const totalFieldsCount = dynamicFormContainer.children.length;

            // Condition 1: Checking empty container workspace form
            if (totalFieldsCount === 0 || (totalFieldsCount === 1 && emptyMessage.style.display !== 'none')) {
                showToast("Please add some fields to the form first!", "error");
                return;
            }

            // Condition 2: Evaluating input element configurations safely 
            let emptyInputsFound = false;
            inputsList.forEach(inputItem => {
                if (inputItem.value.trim() === "") {
                    emptyInputsFound = true;
                }
            });

            if (emptyInputsFound === true) {
                showToast("Please fill all the input fields before copying the code!", "error");
                return;
            }

            // --- AAPKA IDEA INTEGRATION START ---
            
            // 1. Pehle form ka generated inner HTML structural text nikalte hain
            const actualFormHTML = glassForm.outerHTML;
            
            // 2. Ab is form ko ek perfectly matching modern dark background wrapper mein pack karte hain
            // Taake user ke editor mein paste karte hi piche white screen ke bajaye premium dark gradient aaye!
            const fullWrappedHTML = `<!-- Copy this complete block into your HTML document -->
            <div class="bg-gradient-to-br from-indigo-900 via-slate-900 to-purple-900 min-h-screen text-slate-100 p-6 flex flex-col items-center justify-center font-sans">
                
                ${actualFormHTML}

            </div>`;
        });

    </script>
</body>
</html>
